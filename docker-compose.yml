# ============================================================
# MeiDay 后端一键部署（阿里云 ACR 镜像，数据卷持久化 SQLite 与日志）
# 使用：
#   cp .env.example .env   # 可选，按需修改 FRONTEND_ORIGINS
#   docker compose up -d
# 升级：
#   docker compose pull && docker compose up -d
# ============================================================
services:
  meiday:
    image: crpi-8r9w3eevpt68aj3u.cn-hangzhou.personal.cr.aliyuncs.com/congsec/meiday:latest
    container_name: meiday
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # 前端页面访问白名单（逗号分隔）。默认值与后端内置默认一致；
      # 若前端部署在自定义域名，在 .env 中设置 FRONTEND_ORIGINS 覆盖。
      FRONTEND_ORIGINS: "${FRONTEND_ORIGINS:-http://localhost:5173,https://localhost:5173,http://localhost,https://localhost,http://task.congsec.cn,https://task.congsec.cn}"
    volumes:
      - meiday_data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  meiday_data:
